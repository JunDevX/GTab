<!DOCTYPE html>
<html lang="ru" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая вкладка</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="glow glow-top" aria-hidden="true"></div>
  <div class="glow glow-bottom" aria-hidden="true"></div>

  <main class="stage">
    <div class="brand" id="brand" aria-hidden="true"></div>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <div class="field">
        <svg class="lens" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"></circle>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <input id="q" type="text" name="q" placeholder="Поиск" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Поисковый запрос">
        <button class="go" type="submit" aria-label="Найти" title="Найти">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            <path d="M12.5 6.5L18 12l-5.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </form>

    <p class="engine-note"><span id="engine-name">Google</span></p>
  </main>

  <script src="common.js"></script>
  <script src="brand.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
